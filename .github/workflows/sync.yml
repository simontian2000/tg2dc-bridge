
name: Telegram to Discord Sync

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg2dc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Telegram to Discord sync
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          DISCORD_WEBHOOK_CHIGUA: ${{ secrets.DISCORD_WEBHOOK_CHIGUA }}
        run: python -m src.main

      - name: Save message state
        if: always()
        run: |
          if [ -f data/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -f data/state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Telegram sync state [skip ci]"
              git push
            else
              echo "No state changes."
            fi
          else
            echo "No state file found."
          fi
